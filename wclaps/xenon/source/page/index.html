<!doctype html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenon</title>
    <style>
        html, body {margin: 0; height: 100%; overflow: hidden; background: transparent}
        body {user-select: none; -webkit-user-select: none; font-family: system-ui, sans-serif}
        #root {position: absolute; left: 0; top: 0; width: 512px; height: 176px; transform-origin: 0 0}
        canvas {position: absolute; left: 0; display: block; touch-action: none}
        /* openDAW's display frame (Vaporisateur, the modulation editors): a faint outline, the display inset 4px */
        #frame {position: absolute; left: 0; top: 0; width: 512px; height: 104px; box-sizing: border-box; border-radius: 6px;
            outline: 0.5px solid hsla(200, 40%, 70%, 0.08); outline-offset: -1px; pointer-events: none}
        #wave {top: 4px; left: 4px; width: 504px; height: 96px; border-radius: 3px; cursor: crosshair;
            box-shadow: 0 0 4px 0 hsla(200, 83%, 60%, 0.04) inset, 0 0 1px 0 hsla(200, 83%, 60%, 0.04) inset}
        #controls {top: 104px; width: 512px; height: 72px}
        .tag {position: absolute; top: 9px; font-size: 7px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
            color: rgba(255, 255, 255, .8); white-space: nowrap; pointer-events: none}
        #name {left: 12px; max-width: 350px; overflow: hidden}
        .action {pointer-events: auto; cursor: pointer}
        .action:hover {color: #ffffff}
        #load {right: 12px}
        #clear {right: 48px}
        #hint, #drop {position: absolute; left: 4px; top: 4px; width: 504px; height: 96px; display: flex; align-items: center;
            justify-content: center; font-size: 8px; font-weight: 500; letter-spacing: .32em; pointer-events: none}
        #hint {color: rgba(255, 255, 255, .8)}
        #drop {color: rgba(255, 255, 255, .8); opacity: 0; transition: opacity .12s}
        #root.dropping #drop {opacity: 1}
        #root.dropping #hint {opacity: 0}
        .hidden {display: none !important}
        input {display: none}
    </style>
</head>
<body>
<div id="root">
    <div id="frame"></div>
    <canvas id="wave"></canvas>
    <canvas id="controls"></canvas>
    <div id="hint">DROP A SAMPLE</div>
    <div id="drop">DROP</div>
    <div id="name" class="tag"></div>
    <div id="clear" class="tag action hidden">CLEAR</div>
    <div id="load" class="tag action">LOAD</div>
    <input type="file" accept="audio/*">
</div>
<script>
    // message types, see plugin/xenon.cpp
    const PAGE_POLL = 1, PAGE_PARAM_BEGIN = 2, PAGE_PARAM_SET = 3, PAGE_PARAM_END = 4, PAGE_MOD_SET = 5,
        PAGE_SAMPLE_BEGIN = 6, PAGE_HOVER = 7, PAGE_SAMPLE_CHUNK = 8, PAGE_SAMPLE_COMMIT = 9, PAGE_SAMPLE_CLEAR = 10,
        PAGE_REQUEST_PEAKS = 11, PAGE_REQUEST_MODS = 12, PAGE_SAMPLE_NAME = 13
    const PLUGIN_STATUS = 1, PLUGIN_PEAKS = 2, PLUGIN_MODS = 3
    const INVALID_ID = 0xffffffff, STATUS_HEADER = 24, GRAIN_FLOATS = 5
    const RATE = 48000, MAX_SECONDS = 60, CHUNK_FRAMES = 32768
    const WIDTH = 512, HEIGHT = 176, WAVE_HEIGHT = 104, COLUMN = 64, TABS_HEIGHT = 23, TAB_Y = 17, PARAM_Y = 24
    // the waveform inside its frame
    const DISPLAY_WIDTH = 504, DISPLAY_HEIGHT = 96
    const CYAN = [0.18, 0.9, 1.0]
    const DIM = "#5f6268", FAINT = "#34363a", BRIGHT = "#e8e8e8"

    const percent = value => [`${Math.round(value * 100)}`, "%"]
    const milliseconds = value => value >= 1000 ? [(value / 1000).toFixed(2), "S"] : [value < 10 ? value.toFixed(1) : `${Math.round(value)}`, "MS"]
    const signed = (digits, unit) => value => [`${value > 0 ? "+" : ""}${value.toFixed(digits)}`, unit]
    const plain = (digits, unit) => value => [value.toFixed(digits), unit]
    const choice = texts => value => [texts[Math.round(value)], ""]
    const hertz = value => value >= 1000 ? [(value / 1000).toFixed(value >= 10000 ? 1 : 2), "KHZ"] : [`${Math.round(value)}`, "HZ"]
    const LFO_SHAPES = ["SIN", "TRI", "SAW", "SQR", "S&H"]
    // the plugin's table (plugin/xenon.cpp), ids are the indices
    const PARAMS = [
        {label: "POS", min: 0, max: 1, curve: "linear", text: percent, mod: true},
        {label: "SPRAY", min: 0, max: 1, curve: "linear", text: percent, mod: true},
        {label: "SCAN", min: -2, max: 2, curve: "linear", text: signed(2, "X")},
        {label: "SIZE", min: 1, max: 2000, curve: "exp", text: milliseconds, mod: true},
        {label: "DENS", min: 0.5, max: 200, curve: "exp", text: value => [value < 10 ? value.toFixed(1) : `${Math.round(value)}`, "/S"], mod: true},
        {label: "SYNC", min: 0, max: 4, curve: "step", text: choice(["OFF", "1/4", "1/8", "1/16", "1/32"])},
        {label: "REV", min: 0, max: 1, curve: "linear", text: percent, mod: true},
        {label: "SHAPE", min: 0, max: 1, curve: "linear", text: value => [["GAUSS", "HANN", "TRI", "PERC", "SWELL"][Math.round(value * 4)], ""], mod: true},
        {label: "PITCH", min: -48, max: 48, curve: "linear", text: signed(1, "ST"), mod: true},
        {label: "FINE", min: -100, max: 100, curve: "linear", text: signed(0, "CT"), mod: true},
        {label: "RAND", min: 0, max: 24, curve: "linear", text: plain(1, "ST"), mod: true},
        {label: "SCALE", min: 0, max: 4, curve: "step", text: choice(["OFF", "OCT", "5TH", "MAJ", "MIN"])},
        {label: "KEY", min: 0, max: 1, curve: "step", text: choice(["OFF", "ON"])},
        {label: "GLIDE", min: 0, max: 1000, curve: "linear", text: milliseconds},
        {label: "TYPE", min: 0, max: 2, curve: "step", text: choice(["LP", "BP", "HP"])},
        {label: "CUT", min: 20, max: 20000, curve: "exp", text: hertz, mod: true},
        {label: "RES", min: 0, max: 1, curve: "linear", text: percent, mod: true},
        {label: "RAND", min: 0, max: 1, curve: "linear", text: percent, mod: true},
        {label: "AZIM", min: -180, max: 180, curve: "linear", text: signed(0, "°"), mod: true},
        {label: "SPREAD", min: 0, max: 180, curve: "linear", text: plain(0, "°"), mod: true},
        {label: "ELEV", min: -90, max: 90, curve: "linear", text: signed(0, "°"), mod: true},
        {label: "DIST", min: 0.5, max: 30, curve: "exp", text: plain(1, "M"), mod: true},
        {label: "RAND", min: 0, max: 1, curve: "linear", text: percent, mod: true},
        {label: "MOTION", min: 0, max: 1, curve: "linear", text: percent, mod: true},
        {label: "ROOM", min: 0, max: 1, curve: "linear", text: percent, mod: true},
        {label: "WIDTH", min: 0, max: 1, curve: "linear", text: percent},
        {label: "ATK", min: 1, max: 5000, curve: "exp", text: milliseconds},
        {label: "DEC", min: 1, max: 5000, curve: "exp", text: milliseconds},
        {label: "SUS", min: 0, max: 1, curve: "linear", text: percent},
        {label: "REL", min: 1, max: 8000, curve: "exp", text: milliseconds},
        {label: "VEL", min: 0, max: 1, curve: "linear", text: percent},
        {label: "GAIN", min: -36, max: 12, curve: "linear", text: signed(1, "DB"), mod: true},
        {label: "VOICES", min: 1, max: 16, curve: "step", text: plain(0, "")},
        {label: "MODE", min: 0, max: 1, curve: "step", text: choice(["MONO", "POLY"])},
        {label: "L1 RATE", min: 0.02, max: 20, curve: "exp", text: value => [value < 1 ? value.toFixed(2) : value.toFixed(1), "HZ"]},
        {label: "L1 WAVE", min: 0, max: 4, curve: "step", text: choice(LFO_SHAPES)},
        {label: "L2 RATE", min: 0.02, max: 20, curve: "exp", text: value => [value < 1 ? value.toFixed(2) : value.toFixed(1), "HZ"]},
        {label: "L2 WAVE", min: 0, max: 4, curve: "step", text: choice(LFO_SHAPES)},
        {label: "E2 ATK", min: 1, max: 5000, curve: "exp", text: milliseconds},
        {label: "E2 DEC", min: 1, max: 5000, curve: "exp", text: milliseconds},
        {label: "E2 SUS", min: 0, max: 1, curve: "linear", text: percent},
        {label: "E2 REL", min: 1, max: 8000, curve: "exp", text: milliseconds}
    ]
    const DEFAULTS = [0, 0.05, 0, 80, 20, 0, 0, 0.25, 0, 0, 0, 0, 1, 0, 0, 20000, 0.1, 0, 0, 30, 0, 1, 0, 0, 0.15, 1,
        10, 300, 1, 600, 0.5, 0, 8, 1, 0.5, 0, 3, 1, 200, 800, 0, 600]
    const SECTIONS = [
        {name: "GRAIN", ids: [0, 1, 2, 3, 4, 5, 6, 7]},
        {name: "PITCH", ids: [8, 9, 10, 11, 12, 13]},
        {name: "FILTER", ids: [14, 15, 16, 17]},
        {name: "SPACE", ids: [18, 19, 20, 21, 22, 23, 24, 25]},
        {name: "AMP", ids: [26, 27, 28, 29, 30, 31, 32, 33]},
        {name: "MOD", ids: [34, 35, 36, 37, 38, 39, 40, 41]}
    ]
    // the plugin's sources, in its order
    const SOURCES = [
        {label: "L1", color: "#ff8a3d"}, {label: "L2", color: "#ffd23d"}, {label: "E1", color: "#ff4d7a"},
        {label: "E2", color: "#c45cff"}, {label: "RND", color: "#8aff5c"}, {label: "VEL", color: "#f0f0f0"},
        {label: "KEY", color: "#3dff9e"}, {label: "MW", color: "#5c9dff"}, {label: "AT", color: "#ff5cf0"},
        {label: "AGE", color: "#9ee7ff"}
    ]

    const normalize = (id, value) => {
        const {min, max, curve} = PARAMS[id]
        const clamped = Math.min(max, Math.max(min, value))
        return curve === "exp" ? Math.log(clamped / min) / Math.log(max / min) : (clamped - min) / (max - min)
    }
    const denormalize = (id, normal) => {
        const {min, max, curve} = PARAMS[id]
        const clamped = Math.min(1, Math.max(0, normal))
        const value = curve === "exp" ? min * Math.pow(max / min, clamped) : min + clamped * (max - min)
        return curve === "step" ? Math.round(value) : value
    }

    const root = document.getElementById("root")
    const waveCanvas = document.getElementById("wave"), controlCanvas = document.getElementById("controls")
    const nameTag = document.getElementById("name"), hint = document.getElementById("hint")
    const loadAction = document.getElementById("load"), clearAction = document.getElementById("clear")
    const fileInput = document.querySelector("input")
    const state = {
        values: DEFAULTS.slice(), live: DEFAULTS.map((value, id) => normalize(id, value)),
        depths: PARAMS.map(() => SOURCES.map(() => 0)),
        grains: [], sampleGeneration: -1, modGeneration: -1, peaks: null, name: "", frames: 0,
        section: 0, armed: -1, hovered: INVALID_ID, drag: null, scale: 1, ratio: 0, busy: "", cut: false,
        hostKeeps: false // openDAW keeps the sample (opendaw.samples/1): files go to it, the frames come back
    }

    const post = buffer => window.parent.postMessage(buffer, "*")
    const postParam = (type, id, value) => {
        const message = new DataView(new ArrayBuffer(type === PAGE_PARAM_SET ? 16 : 8))
        message.setUint8(0, type)
        message.setUint32(4, id, true)
        if (type === PAGE_PARAM_SET) {message.setFloat64(8, value, true)}
        post(message.buffer)
    }
    // live: a drag's step, the plugin tells the host of the change only with the drag's last (one undo step)
    const postDepth = (id, source, depth, live = false) => {
        const message = new DataView(new ArrayBuffer(16))
        message.setUint8(0, PAGE_MOD_SET)
        message.setUint8(1, live ? 1 : 0)
        message.setUint32(4, id, true)
        message.setUint32(8, source, true)
        message.setFloat32(12, depth, true)
        post(message.buffer)
    }
    const hover = id => {
        if (state.hovered === id) {return}
        state.hovered = id
        const message = new DataView(new ArrayBuffer(8))
        message.setUint8(0, PAGE_HOVER)
        message.setUint32(4, id, true)
        post(message.buffer)
    }
    const setValue = (id, value) => {
        const next = Math.min(PARAMS[id].max, Math.max(PARAMS[id].min, value))
        if (next === state.values[id]) {return}
        state.values[id] = next
        postParam(PAGE_PARAM_SET, id, next)
    }

    // ---- the sample: decoded at 48 kHz, mixed to mono, sent as 16-bit chunks ----

    // openDAW imports the file into its samples and hands the frames to the plugin, which keeps only the name
    const handToHost = file => {
        const name = new TextEncoder().encode(file.name.replace(/\.[^.]+$/, "").slice(0, 100))
        const message = new Uint8Array(8 + name.length)
        message[0] = PAGE_SAMPLE_NAME
        new DataView(message.buffer).setUint32(4, name.length, true)
        message.set(name, 8)
        post(message.buffer)
        window.parent.postMessage({webclapSample: {key: 0, file}}, "*")
        state.cut = false
        state.busy = "LOADING"
        updateTags()
    }
    const upload = async file => {
        if (state.hostKeeps) {return handToHost(file)}
        state.busy = "DECODING"
        updateTags()
        const context = new OfflineAudioContext(1, 1, RATE)
        const buffer = await context.decodeAudioData(await file.arrayBuffer())
        const frames = Math.min(buffer.length, Math.round(buffer.sampleRate * MAX_SECONDS))
        const mono = new Float32Array(frames)
        for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const data = buffer.getChannelData(channel)
            for (let index = 0; index < frames; index++) {mono[index] += data[index] / buffer.numberOfChannels}
        }
        let peak = 0
        for (let index = 0; index < frames; index++) {peak = Math.max(peak, Math.abs(mono[index]))}
        const gain = peak > 1 ? 1 / peak : 1
        const name = new TextEncoder().encode(file.name.replace(/\.[^.]+$/, "").slice(0, 100))
        const begin = new DataView(new ArrayBuffer(20 + name.length))
        begin.setUint8(0, PAGE_SAMPLE_BEGIN)
        begin.setUint32(4, frames, true)
        begin.setFloat64(8, buffer.sampleRate, true)
        begin.setUint32(16, name.length, true)
        new Uint8Array(begin.buffer).set(name, 20)
        post(begin.buffer)
        for (let offset = 0; offset < frames; offset += CHUNK_FRAMES) {
            const count = Math.min(CHUNK_FRAMES, frames - offset)
            const message = new DataView(new ArrayBuffer(12 + count * 2))
            message.setUint8(0, PAGE_SAMPLE_CHUNK)
            message.setUint32(4, offset, true)
            message.setUint32(8, count, true)
            for (let index = 0; index < count; index++) {
                message.setInt16(12 + index * 2, Math.round(Math.max(-1, Math.min(32767 / 32768, mono[offset + index] * gain)) * 32768), true)
            }
            post(message.buffer)
        }
        post(new Uint8Array([PAGE_SAMPLE_COMMIT]).buffer)
        state.cut = buffer.length > frames
        state.busy = ""
        updateTags()
    }
    const tryUpload = file => {
        if (file === undefined) {return}
        upload(file).catch(() => {
            state.busy = "NOT AN AUDIO FILE"
            updateTags()
            setTimeout(() => {state.busy = ""; updateTags()}, 2000)
        })
    }
    const updateTags = () => {
        const loaded = state.frames > 0
        nameTag.textContent = state.busy !== "" ? state.busy
            : loaded ? `${state.name} · ${(state.frames / state.rate).toFixed(2)} S${state.cut ? ` · CUT TO ${MAX_SECONDS} S` : ""}` : ""
        hint.classList.toggle("hidden", loaded || state.busy !== "")
        clearAction.classList.toggle("hidden", !loaded)
    }
    loadAction.addEventListener("click", () => fileInput.click())
    clearAction.addEventListener("click", () => {
        state.cut = false
        post(new Uint8Array([PAGE_SAMPLE_CLEAR]).buffer)
        if (state.hostKeeps) {window.parent.postMessage({webclapSample: {key: 0}}, "*")}
    })
    fileInput.addEventListener("change", () => {
        tryUpload(fileInput.files[0])
        fileInput.value = ""
    })
    window.addEventListener("dragover", event => {
        event.preventDefault()
        root.classList.add("dropping")
    })
    window.addEventListener("dragleave", event => {if (event.relatedTarget === null) {root.classList.remove("dropping")}})
    window.addEventListener("drop", event => {
        event.preventDefault()
        root.classList.remove("dropping")
        tryUpload(event.dataTransfer.files[0])
    })

    // ---- the waveform: one line moved by noise as far as the sample is loud, grains excite it ----

    const PEAK_COLUMNS = 2048, ACTIVITY_COLUMNS = 512
    const FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D peaks;
uniform sampler2D activity;
uniform vec2 size;
uniform float scale;
uniform float time;
uniform vec3 hue;
uniform vec2 range;
uniform float dropping;
uniform float loaded;
out vec4 fragment;
float hash(vec2 p) {p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y);}
float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) {v += a * noise(p); p = p * 2.03 + 17.0; a *= 0.5;} return v;}
float amplitude(float x) {vec2 p = texture(peaks, vec2(clamp(x, 0.0, 1.0), 0.5)).rg * 2.0 - 1.0; return max(abs(p.x), abs(p.y)) * loaded + 0.02;}
float act(float x) {return 1.6 * (1.0 - exp(-texture(activity, vec2(clamp(x, 0.0, 1.0), 0.5)).r * 2.5));}
float line(float x, float span) {
    return (fbm(vec2(x * 48.0 + time * 0.6, time * 1.4)) - 0.5) * 2.4 * amplitude(x) * span * (0.35 + act(x));
}
void main() {
    vec2 pixel = gl_FragCoord.xy;
    float x = pixel.x / size.x;
    float span = size.y * 0.42;
    float y = pixel.y - size.y * 0.5;
    float radius = 14.0 * scale;
    float a = act(x);
    float d = 1e9;
    for (int j = -6; j <= 6; j++) {
        float dx = float(j) * radius / 6.0;
        d = min(d, length(vec2(dx, y - line(x + dx / size.x, span))));
    }
    float center = line(x, span);
    float haze = fbm(vec2(x * 22.0, y / span * 2.0 - time * 1.2)) * exp(-abs(y - center) / (10.0 * scale)) * (0.15 + 0.5 * a) * amplitude(x);
    float core = exp(-d / (1.0 * scale));
    float glow = exp(-d / (7.0 * scale * (1.0 + 0.8 * a))) * 0.6;
    vec3 color = hue * (glow + haze + core * 0.6) + vec3(core * (0.3 + 0.4 * a));
    float marker = abs(pixel.x - range.x * size.x);
    color += hue * exp(-marker / (0.6 * scale)) * 0.3 * loaded;
    float spray = 1.0 - smoothstep(range.y * 0.6, range.y + 0.004, abs(x - range.x));
    color += hue * spray * 0.012 * loaded;
    color *= mix(1.0, 0.22, dropping);
    color = 1.0 - exp(-color * 1.35);
    fragment = vec4(color, clamp(max(color.r, max(color.g, color.b)) * 1.2, 0.0, 1.0));
}`
    const createWave = () => {
        const gl = waveCanvas.getContext("webgl2", {premultipliedAlpha: true, antialias: false})
        if (gl === null) {return null}
        const compile = (type, source) => {
            const shader = gl.createShader(type)
            gl.shaderSource(shader, source)
            gl.compileShader(shader)
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {console.warn(gl.getShaderInfoLog(shader))}
            return shader
        }
        const program = gl.createProgram()
        gl.attachShader(program, compile(gl.VERTEX_SHADER, "#version 300 es\nin vec2 position;\nvoid main() {gl_Position = vec4(position, 0.0, 1.0);}"))
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT))
        gl.linkProgram(program)
        gl.useProgram(program)
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
        const location = gl.getAttribLocation(program, "position")
        gl.enableVertexAttribArray(location)
        gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0)
        const texture = (unit, width) => {
            const handle = gl.createTexture()
            gl.activeTexture(gl.TEXTURE0 + unit)
            gl.bindTexture(gl.TEXTURE_2D, handle)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(width * 4).fill(127))
        }
        texture(0, PEAK_COLUMNS)
        texture(1, ACTIVITY_COLUMNS)
        const uniform = name => gl.getUniformLocation(program, name)
        gl.uniform1i(uniform("peaks"), 0)
        gl.uniform1i(uniform("activity"), 1)
        const activity = new Float32Array(ACTIVITY_COLUMNS), activityBytes = new Uint8Array(ACTIVITY_COLUMNS * 4)
        return {
            setPeaks: bytes => {
                const data = new Uint8Array(PEAK_COLUMNS * 4).fill(127)
                if (bytes !== null) {
                    let peak = 1
                    for (let index = 0; index < bytes.length; index++) {peak = Math.max(peak, Math.abs(bytes[index]))}
                    for (let column = 0; column < PEAK_COLUMNS; column++) {
                        data[column * 4] = Math.round((bytes[column * 2] / peak + 1) * 127.5)
                        data[column * 4 + 1] = Math.round((bytes[column * 2 + 1] / peak + 1) * 127.5)
                    }
                }
                gl.activeTexture(gl.TEXTURE0)
                gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, PEAK_COLUMNS, 1, gl.RGBA, gl.UNSIGNED_BYTE, data)
            },
            render: (time, dropping) => {
                const width = waveCanvas.width, height = waveCanvas.height
                activity.fill(0)
                for (const grain of state.grains) {
                    const spread = Math.max(grain.width, 0.004)
                    const from = Math.max(0, Math.floor((grain.x - spread * 3) * ACTIVITY_COLUMNS))
                    const to = Math.min(ACTIVITY_COLUMNS - 1, Math.ceil((grain.x + spread * 3) * ACTIVITY_COLUMNS))
                    for (let column = from; column <= to; column++) {
                        const distance = (column / ACTIVITY_COLUMNS - grain.x) / spread
                        activity[column] += grain.amp * Math.exp(-distance * distance)
                    }
                }
                for (let column = 0; column < ACTIVITY_COLUMNS; column++) {activityBytes[column * 4] = Math.min(255, Math.round(activity[column] / 2.5 * 255))}
                gl.activeTexture(gl.TEXTURE1)
                gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, ACTIVITY_COLUMNS, 1, gl.RGBA, gl.UNSIGNED_BYTE, activityBytes)
                gl.viewport(0, 0, width, height)
                gl.uniform2f(uniform("size"), width, height)
                gl.uniform1f(uniform("scale"), state.scale * state.ratio)
                gl.uniform1f(uniform("time"), time)
                gl.uniform3fv(uniform("hue"), CYAN)
                gl.uniform2f(uniform("range"), state.live[0], denormalize(1, state.live[1]) * 0.5)
                gl.uniform1f(uniform("dropping"), dropping)
                gl.uniform1f(uniform("loaded"), state.frames > 0 ? 1 : 0)
                gl.clearColor(0, 0, 0, 0)
                gl.clear(gl.COLOR_BUFFER_BIT)
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
            }
        }
    }
    const wave = createWave()

    // ---- the controls: a section's parameters as label, number and nine dots ----

    const context = controlCanvas.getContext("2d")
    const tabLayout = () => {
        context.font = "500 7px system-ui"
        context.letterSpacing = "1.2px"
        let x = 8
        const tabs = SECTIONS.map(({name}) => {
            const width = context.measureText(name).width
            const tab = {x, width}
            x += width + 9
            return tab
        })
        context.letterSpacing = "0.6px"
        let right = WIDTH - 8
        const sources = SOURCES.map(({label}) => ({label, width: context.measureText(label).width})).reverse().map(source => {
            right -= source.width
            const placed = {x: right, width: source.width}
            right -= 12
            return placed
        }).reverse()
        context.letterSpacing = "0px"
        return {tabs, sources}
    }
    const drawControls = () => {
        const unit = state.scale * state.ratio
        context.setTransform(unit, 0, 0, unit, 0, 0)
        context.clearRect(0, 0, WIDTH, HEIGHT - WAVE_HEIGHT)
        const {tabs, sources} = tabLayout()
        context.textAlign = "left"
        context.font = "500 7px system-ui"
        context.letterSpacing = "1.2px"
        SECTIONS.forEach(({name}, index) => {
            const active = index === state.section
            context.fillStyle = active ? BRIGHT : DIM
            context.fillText(name, tabs[index].x, TAB_Y)
        })
        context.letterSpacing = "0.6px"
        SOURCES.forEach((source, index) => {
            const armed = index === state.armed
            const used = state.depths.some(row => row[index] !== 0)
            context.fillStyle = armed ? BRIGHT : used ? "#9a9da3" : DIM
            context.fillText(source.label, sources[index].x, TAB_Y)
            context.fillStyle = source.color
            context.globalAlpha = armed || used ? 1 : 0.45
            context.beginPath()
            context.arc(sources[index].x - 4, TAB_Y - 2.5, armed ? 1.8 : 1.2, 0, Math.PI * 2)
            context.fill()
            context.globalAlpha = 1
        })
        context.letterSpacing = "1px"
        context.textAlign = "center"
        SECTIONS[state.section].ids.forEach((id, column) => drawParam(id, column * COLUMN + COLUMN / 2))
        context.letterSpacing = "0px"
    }
    const drawParam = (id, center) => {
        const param = PARAMS[id]
        const value = state.values[id]
        const normal = normalize(id, value)
        const armed = state.armed >= 0
        const assignable = !armed || param.mod === true
        const highlighted = id === state.hovered || state.drag?.id === id
        context.globalAlpha = assignable ? 1 : 0.3
        context.font = "500 7px system-ui"
        context.fillStyle = highlighted ? BRIGHT : DIM
        context.fillText(param.label, center, PARAM_Y + 10)
        const [number, suffix] = param.text(value)
        context.font = "300 16px system-ui"
        const numberWidth = context.measureText(number).width
        context.font = "500 6px system-ui"
        const suffixWidth = suffix === "" ? 0 : context.measureText(suffix).width + 2
        const left = center - (numberWidth + suffixWidth) / 2
        context.textAlign = "left"
        context.font = "300 16px system-ui"
        context.fillStyle = BRIGHT
        context.fillText(number, left, PARAM_Y + 29)
        if (suffix !== "") {
            context.font = "500 6px system-ui"
            context.fillStyle = DIM
            context.fillText(suffix, left + numberWidth + 2, PARAM_Y + 29)
        }
        context.textAlign = "center"
        const lit = Math.round(normal * 8)
        for (let index = 0; index <= 8; index++) {
            context.fillStyle = index <= lit ? BRIGHT : FAINT
            context.beginPath()
            context.arc(center - 16 + index * 4, PARAM_Y + 39, index === lit ? 1.4 : 1, 0, Math.PI * 2)
            context.fill()
        }
        if (param.mod === true) {drawModulation(id, center, normal)}
        context.globalAlpha = 1
    }
    const dotX = (center, normal) => center - 16 + Math.min(1, Math.max(0, normal)) * 32
    const drawModulation = (id, center, normal) => {
        const y = PARAM_Y + 45
        if (state.armed >= 0) {
            const depth = state.depths[id][state.armed]
            if (depth === 0) {return}
            context.strokeStyle = SOURCES[state.armed].color
            context.lineWidth = 1
            context.beginPath()
            context.moveTo(dotX(center, normal), y)
            context.lineTo(dotX(center, normal + depth), y)
            context.stroke()
            return
        }
        const strongest = state.depths[id].reduce((best, depth, source) =>
            Math.abs(depth) > Math.abs(state.depths[id][best]) ? source : best, 0)
        if (state.depths[id][strongest] === 0) {return}
        context.fillStyle = SOURCES[strongest].color
        context.beginPath()
        context.arc(dotX(center, state.live[id]), y, 1.3, 0, Math.PI * 2)
        context.fill()
    }

    // ---- pointer: drag a number, click a tab or a source, the waveform sets the position ----

    const toLocal = (event, element) => {
        const bounds = element.getBoundingClientRect()
        return {x: (event.clientX - bounds.left) / state.scale, y: (event.clientY - bounds.top) / state.scale}
    }
    const hitControl = ({x, y}) => {
        if (y < TABS_HEIGHT) {
            const {tabs, sources} = tabLayout()
            const tab = tabs.findIndex(tab => x >= tab.x - 4 && x < tab.x + tab.width + 6)
            if (tab >= 0) {return {tab}}
            const source = sources.findIndex(source => x >= source.x - 9 && x < source.x + source.width + 4)
            if (source >= 0) {return {source}}
            return null
        }
        const ids = SECTIONS[state.section].ids
        const column = Math.floor(x / COLUMN)
        return column < ids.length ? {id: ids[column]} : null
    }
    const assignable = id => state.armed < 0 || PARAMS[id].mod === true
    controlCanvas.addEventListener("pointermove", event => {
        const point = toLocal(event, controlCanvas)
        const drag = state.drag
        if (drag !== null) {
            const travel = (drag.startY - event.clientY) / state.scale
            drag.moved = drag.moved || Math.abs(travel) > 2
            if (drag.source >= 0) {
                const depth = Math.min(1, Math.max(-1, drag.start + travel / (event.shiftKey ? 600 : 120)))
                state.depths[drag.id][drag.source] = Math.abs(depth) < 0.005 ? 0 : depth
                postDepth(drag.id, drag.source, state.depths[drag.id][drag.source], true)
            } else if (PARAMS[drag.id].curve === "step") {
                const steps = Math.round(travel / 12)
                setValue(drag.id, drag.start + steps)
            } else {
                setValue(drag.id, denormalize(drag.id, normalize(drag.id, drag.start) + travel / (event.shiftKey ? 600 : 150)))
            }
            return
        }
        const hit = hitControl(point)
        const id = hit?.id
        controlCanvas.style.cursor = hit === null ? "default" : hit.id === undefined ? "pointer"
            : assignable(id) ? "ns-resize" : "default"
        hover(id !== undefined && assignable(id) ? id : INVALID_ID)
    })
    controlCanvas.addEventListener("pointerleave", () => {if (state.drag === null) {hover(INVALID_ID)}})
    controlCanvas.addEventListener("pointerdown", event => {
        // ctrl+click is the context click on macOS, it arrives as button 0
        if (event.button !== 0 || event.ctrlKey) {return}
        const hit = hitControl(toLocal(event, controlCanvas))
        if (hit === null) {return}
        if (hit.tab !== undefined) {
            state.section = hit.tab
            return
        }
        if (hit.source !== undefined) {
            state.armed = state.armed === hit.source ? -1 : hit.source
            return
        }
        if (!assignable(hit.id)) {return}
        controlCanvas.setPointerCapture(event.pointerId)
        const source = state.armed
        state.drag = {id: hit.id, source, startY: event.clientY, moved: false,
            start: source >= 0 ? state.depths[hit.id][source] : state.values[hit.id]}
        if (source < 0) {postParam(PAGE_PARAM_BEGIN, hit.id)}
    })
    const release = () => {
        const drag = state.drag
        if (drag === null) {return}
        state.drag = null
        if (drag.source >= 0) {
            if (drag.moved) {postDepth(drag.id, drag.source, state.depths[drag.id][drag.source])}
            return
        }
        // a click without a move steps a choice to its next option
        if (!drag.moved && PARAMS[drag.id].curve === "step") {
            const {min, max} = PARAMS[drag.id]
            setValue(drag.id, state.values[drag.id] >= max ? min : state.values[drag.id] + 1)
        }
        postParam(PAGE_PARAM_END, drag.id)
    }
    controlCanvas.addEventListener("pointerup", release)
    controlCanvas.addEventListener("lostpointercapture", release)
    controlCanvas.addEventListener("dblclick", event => {
        const hit = hitControl(toLocal(event, controlCanvas))
        if (hit === null || hit.id === undefined || !assignable(hit.id)) {return}
        if (state.armed >= 0) {
            state.depths[hit.id][state.armed] = 0
            postDepth(hit.id, state.armed, 0)
            return
        }
        postParam(PAGE_PARAM_BEGIN, hit.id)
        setValue(hit.id, DEFAULTS[hit.id])
        postParam(PAGE_PARAM_END, hit.id)
    })
    controlCanvas.addEventListener("wheel", event => {
        const hit = hitControl(toLocal(event, controlCanvas))
        if (hit === null || hit.id === undefined || state.armed >= 0) {return}
        event.preventDefault()
        const direction = event.deltaY < 0 ? 1 : event.deltaY > 0 ? -1 : 0
        if (direction === 0) {return}
        const id = hit.id
        postParam(PAGE_PARAM_BEGIN, id)
        setValue(id, PARAMS[id].curve === "step" ? state.values[id] + direction
            : denormalize(id, normalize(id, state.values[id]) + direction * (event.shiftKey ? 0.002 : 0.02)))
        postParam(PAGE_PARAM_END, id)
    }, {passive: false})
    window.addEventListener("keydown", event => {if (event.key === "Escape") {state.armed = -1}})
    waveCanvas.addEventListener("pointerdown", event => {
        if (event.button !== 0 || event.ctrlKey || state.frames === 0) {return}
        waveCanvas.setPointerCapture(event.pointerId)
        state.drag = {id: 0, source: -1, startY: event.clientY, moved: true, start: state.values[0], wave: true}
        postParam(PAGE_PARAM_BEGIN, 0)
        setValue(0, Math.min(1, Math.max(0, toLocal(event, waveCanvas).x / DISPLAY_WIDTH)))
    })
    waveCanvas.addEventListener("pointermove", event => {
        if (state.drag?.wave) {setValue(0, Math.min(1, Math.max(0, toLocal(event, waveCanvas).x / DISPLAY_WIDTH)))}
        else {hover(state.frames > 0 ? 0 : INVALID_ID)}
    })
    waveCanvas.addEventListener("pointerleave", () => {if (state.drag === null) {hover(INVALID_ID)}})
    waveCanvas.addEventListener("pointerup", release)
    waveCanvas.addEventListener("lostpointercapture", release)

    // ---- the plugin's messages ----

    window.addEventListener("message", event => {
        if (!(event.data instanceof ArrayBuffer) || event.data.byteLength < 1) {return}
        const view = new DataView(event.data)
        const type = view.getUint8(0)
        if (type === PLUGIN_STATUS && view.byteLength >= STATUS_HEADER + PARAMS.length * 12) {
            const count = view.getUint32(4, true), sampleGeneration = view.getUint32(8, true), modGeneration = view.getUint32(12, true)
            if (sampleGeneration !== state.sampleGeneration) {
                state.sampleGeneration = sampleGeneration
                post(new Uint8Array([PAGE_REQUEST_PEAKS]).buffer)
            }
            if (modGeneration !== state.modGeneration) {
                state.modGeneration = modGeneration
                post(new Uint8Array([PAGE_REQUEST_MODS]).buffer)
            }
            for (let id = 0; id < PARAMS.length; id++) {
                if (state.drag?.id === id && state.drag.source < 0) {continue}
                state.values[id] = view.getFloat64(STATUS_HEADER + id * 8, true)
                state.live[id] = view.getFloat32(STATUS_HEADER + PARAMS.length * 8 + id * 4, true)
            }
            const base = STATUS_HEADER + PARAMS.length * 12
            state.grains = []
            for (let index = 0; index < count && base + (index + 1) * GRAIN_FLOATS * 4 <= view.byteLength; index++) {
                const offset = base + index * GRAIN_FLOATS * 4
                state.grains.push({
                    x: view.getFloat32(offset, true), width: view.getFloat32(offset + 4, true),
                    amp: view.getFloat32(offset + 8, true), depth: view.getFloat32(offset + 12, true)
                })
            }
        } else if (type === PLUGIN_PEAKS && view.byteLength >= 152) {
            const frames = view.getUint32(4, true), columns = view.getUint32(16, true)
            state.hostKeeps = (view.getUint8(1) & 1) !== 0
            if (state.busy === "LOADING") {state.busy = ""}
            state.frames = frames
            state.rate = view.getFloat64(8, true)
            state.name = new TextDecoder().decode(new Uint8Array(event.data, 28, Math.min(100, view.getUint32(20, true)))).toUpperCase()
            state.peaks = columns === PEAK_COLUMNS && view.byteLength >= 152 + columns * 2 ? new Int8Array(event.data, 152, columns * 2) : null
            wave?.setPeaks(state.peaks)
            if (frames === 0) {state.cut = false}
            updateTags()
        } else if (type === PLUGIN_MODS && view.byteLength >= 16) {
            const sources = view.getUint32(4, true), targets = view.getUint32(8, true)
            if (view.byteLength < 16 + sources * targets * 4) {return}
            for (let id = 0; id < Math.min(targets, PARAMS.length); id++) {
                for (let source = 0; source < Math.min(sources, SOURCES.length); source++) {
                    state.depths[id][source] = view.getFloat32(16 + (id * sources + source) * 4, true)
                }
            }
        }
    })

    // ---- layout: the 512 x 176 panel scaled into the page, drawn at the screen's pixel density ----

    const resize = () => {
        state.ratio = window.devicePixelRatio || 1
        state.scale = Math.max(0.25, Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT))
        root.style.transform = `translate(${(window.innerWidth - WIDTH * state.scale) / 2}px, ${(window.innerHeight - HEIGHT * state.scale) / 2}px) scale(${state.scale})`
        const unit = state.scale * state.ratio
        waveCanvas.width = Math.round(DISPLAY_WIDTH * unit)
        waveCanvas.height = Math.round(DISPLAY_HEIGHT * unit)
        controlCanvas.width = Math.round(WIDTH * unit)
        controlCanvas.height = Math.round((HEIGHT - WAVE_HEIGHT) * unit)
    }
    window.addEventListener("resize", resize)
    resize()
    updateTags()
    post(new Uint8Array([PAGE_REQUEST_PEAKS]).buffer)
    post(new Uint8Array([PAGE_REQUEST_MODS]).buffer)
    let dropLevel = 0
    const frame = now => {
        post(new Uint8Array([PAGE_POLL]).buffer)
        // another screen or a browser zoom changes the pixel density without a resize
        if ((window.devicePixelRatio || 1) !== state.ratio) {resize()}
        dropLevel += ((root.classList.contains("dropping") ? 1 : 0) - dropLevel) * 0.25
        wave?.render(now / 1000, dropLevel)
        drawControls()
        requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
</script>
</body>
</html>
